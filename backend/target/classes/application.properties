# Server configuration
server.port=8080
server.address=0.0.0.0

# Database configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skill_arc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ??m b?o Hibernate t? ??ng t?o b?ng
spring.jpa.generate-ddl=true

# JWT Secret Key
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Gemini AI Configuration (GCP Vertex AI)
gemini.api.key=${GEMINI_API_KEY}
